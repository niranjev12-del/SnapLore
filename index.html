<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SnapLore - Online Store</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f5f5f5;
            color: #333;
        }

        header {
            background: #222;
            color: white;
            padding: 18px 7%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        header h1 {
            font-size: 26px;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-left: 20px;
        }

        .cart-button {
            background: #00BFFf;
            border: none;
            padding: 10px 15px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            font-size: 16px;
        }

        .hero {
            text-align: center;
            padding: 60px 20px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
        }

        .hero h2 {
            font-size: 40px;
            margin-bottom: 10px;
        }

        .hero p {
            font-size: 18px;
            line-height: 1.5;
        }

        .controls {
            padding: 25px 7%;
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        .controls input,
        .controls select {
            padding: 12px;
            width: 250px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 16px;
            background: white;
        }

        .products {
            padding: 20px 7% 50px;
            min-height: 400px;
        }

        .products h2 {
            text-align: center;
            margin-bottom: 25px;
            font-size: 34px;
        }

        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 25px;
        }

        .product {
            background: white;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 3px 10px rgba(0,0,0,0.1);
            transition: 0.3s;
        }

        .product:hover {
            transform: translateY(-5px);
        }

        .product img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            display: block;
            background: #eee;
        }

        .product-info {
            padding: 15px;
        }

        .product-info h3 {
            margin-bottom: 8px;
        }

        .price {
            color: #e65100;
            font-size: 20px;
            font-weight: bold;
            margin: 10px 0;
        }

        .add-btn {
            width: 100%;
            padding: 11px;
            border: none;
            background: #222;
            color: white;
            border-radius: 5px;
            cursor: pointer;
            font-size: 15px;
        }

        .add-btn:hover {
            background: #ff9800;
        }

        .status-message {
            text-align: center;
            padding: 30px 15px;
            font-size: 18px;
            grid-column: 1 / -1;
        }

        .error-message {
            color: #c62828;
            background: #ffebee;
            border-radius: 8px;
        }

        .cart {
            position: fixed;
            top: 0;
            right: -420px;
            width: 400px;
            max-width: 100%;
            height: 100vh;
            background: white;
            box-shadow: -3px 0 10px rgba(0,0,0,0.2);
            z-index: 200;
            padding: 25px;
            transition: 0.3s;
            overflow-y: auto;
        }

        .cart.active {
            right: 0;
        }

        .cart-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .close-cart {
            border: none;
            background: #e53935;
            color: white;
            padding: 7px 10px;
            border-radius: 5px;
            cursor: pointer;
        }

        .cart-item {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
            padding-bottom: 15px;
            border-bottom: 1px solid #ddd;
        }

        .cart-item img {
            width: 70px;
            height: 70px;
            object-fit: cover;
            border-radius: 5px;
        }

        .cart-details {
            flex: 1;
        }

        .quantity {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 7px;
        }

        .quantity button {
            border: none;
            background: #ddd;
            padding: 4px 9px;
            cursor: pointer;
        }

        .remove {
            color: red;
            border: none;
            background: none;
            cursor: pointer;
            margin-top: 5px;
        }

        .cart-total {
            font-size: 20px;
            font-weight: bold;
            margin: 20px 0;
        }

        .checkout-btn {
            width: 100%;
            padding: 13px;
            background: #28a745;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }

        .checkout {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.6);
            z-index: 300;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .checkout.active {
            display: flex;
        }

        .checkout-box {
            background: white;
            padding: 30px;
            width: 500px;
            max-width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            border-radius: 10px;
        }

        .checkout-box h2 {
            margin-bottom: 20px;
        }

        .checkout-box input,
        .checkout-box textarea,
        .checkout-box select {
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 15px;
        }

        .place-order {
            width: 100%;
            padding: 13px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 10px;
            font-size: 16px;
        }

        .cancel {
            width: 100%;
            padding: 10px;
            margin-top: 8px;
            background: #ddd;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        footer {
            background: #222;
            color: white;
            text-align: center;
            padding: 20px;
        }

        @media (max-width: 600px) {
            header {
                padding: 15px;
            }

            nav {
                display: none;
            }

            .hero {
                padding: 60px 15px;
            }

            .hero h2 {
                font-size: 30px;
            }

            .hero p {
                font-size: 17px;
            }

            .controls {
                padding: 25px 15px;
            }

            .controls input,
            .controls select {
                width: 100%;
                max-width: 460px;
            }

            .cart {
                width: 100%;
            }
        }
    </style>
</head>

<body>

<header>
    <h1>SnapLore</h1>

    <nav>
        <a href="#home">Home</a>
        <a href="#products">Products</a>
    </nav>

    <button class="cart-button" onclick="openCart()">
        🛒 Cart (<span id="cart-count">0</span>)
    </button>
</header>

<section class="hero" id="home">
    <h2>Welcome to SnapLore</h2>
    <p>
        Best place for Gifting<br>
        Quality products at affordable prices
    </p>
</section>

<div class="controls">
    <input
        type="text"
        id="search"
        placeholder="Search products..."
    >

    <select id="category">
        <option value="all">All Categories</option>
        <option value="frames">Frames</option>
        <option value="hampers">Hampers</option>
        <option value="bouquets">Bouquets</option>
    </select>
</div>

<section class="products" id="products">
    <h2>Our Products</h2>

    <div class="product-grid" id="product-list">
        <div class="status-message" id="products-status">
            Loading products...
        </div>
    </div>
</section>

<div class="cart" id="cart">

    <div class="cart-header">
        <h2>Your Cart</h2>
        <button class="close-cart" onclick="closeCart()">✕</button>
    </div>

    <div id="cart-items"></div>

    <div class="cart-total">
        Total: ₹<span id="cart-total">0</span>
    </div>

    <button class="checkout-btn" onclick="openCheckout()">
        Proceed to Checkout
    </button>

</div>

<div class="checkout" id="checkout">

    <div class="checkout-box">

        <h2>Checkout</h2>

        <form id="checkout-form">

            <input
                type="text"
                id="name"
                placeholder="Full Name"
                required
            >

            <input
                type="email"
                id="email"
                placeholder="Email Address"
                required
            >

            <input
                type="tel"
                id="phone"
                placeholder="Phone Number"
                required
            >

            <textarea
                id="address"
                rows="4"
                placeholder="Delivery Address"
                required
            ></textarea>

            <select id="payment" required>
                <option value="">Select Payment Method</option>
                <option value="cod">Cash on Delivery</option>
                <option value="upi">UPI</option>
                <option value="card">Credit/Debit Card</option>
            </select>

            <button class="place-order" type="submit">
                Place Order
            </button>

            <button
                type="button"
                class="cancel"
                onclick="closeCheckout()"
            >
                Cancel
            </button>

        </form>

    </div>

</div>

<footer>
    <p>© SnapLore. All Rights Reserved.</p>
</footer>

<script>
    // =========================
    // PRODUCT DATA
    // =========================

    let products = [];
    let cart = [];

    // Load products from the Render API
    async function loadProducts() {

        const list = document.getElementById("product-list");

        list.innerHTML = `
            <div class="status-message">
                Loading products...
            </div>
        `;

        try {

            const response = await fetch("/api/products", {
                method: "GET",
                cache: "no-store"
            });

            if (!response.ok) {
                throw new Error(
                    "Server returned HTTP " + response.status
                );
            }

            const data = await response.json();

            console.log("Products received:", data);

            if (!Array.isArray(data)) {
                throw new Error(
                    "API did not return a product array."
                );
            }

            products = data;

            displayProducts();

        } catch (error) {

            console.error(
                "Product loading error:",
                error
            );

            list.innerHTML = `
                <div class="status-message error-message">
                    <strong>Could not load products.</strong>
                    <br><br>
                    Please refresh the page and try again.
                </div>
            `;
        }
    }


    // =========================
    // DISPLAY PRODUCTS
    // =========================

    function displayProducts() {

        const list =
            document.getElementById("product-list");

        const searchInput =
            document.getElementById("search");

        const categoryInput =
            document.getElementById("category");

        const search = searchInput
            ? searchInput.value.trim().toLowerCase()
            : "";

        const category = categoryInput
            ? categoryInput.value
            : "all";

        list.innerHTML = "";


        // No products
        if (
            !Array.isArray(products) ||
            products.length === 0
        ) {

            list.innerHTML = `
                <div class="status-message">
                    No products are available right now.
                </div>
            `;

            return;
        }


        // Filter products
        const filteredProducts =
            products.filter(product => {

                const name =
                    String(
                        product.name || ""
                    ).toLowerCase();

                const productCategory =
                    String(
                        product.category || ""
                    ).toLowerCase();

                const matchesSearch =
                    name.includes(search);

                const matchesCategory =
                    category === "all" ||
                    productCategory ===
                    category.toLowerCase();

                return (
                    matchesSearch &&
                    matchesCategory
                );
            });


        // No matching products
        if (filteredProducts.length === 0) {

            list.innerHTML = `
                <div class="status-message">
                    No products found.
                </div>
            `;

            return;
        }


        // Create product cards
        filteredProducts.forEach(product => {

            const id = product.id;

            const name =
                String(
                    product.name || "Product"
                );

            const price =
                Number(product.price) || 0;

            const image =
                String(product.image || "");


            // Product card
            const productCard =
                document.createElement("div");

            productCard.className = "product";


            // Product image
            const imageElement =
                document.createElement("img");

            imageElement.src = image;
            imageElement.alt = name;

            imageElement.onerror =
                function () {

                    this.style.display = "none";
                };


            // Product information
            const info =
                document.createElement("div");

            info.className = "product-info";


            // Product name
            const title =
                document.createElement("h3");

            title.textContent = name;


            // Price
            const priceElement =
                document.createElement("p");

            priceElement.className = "price";

            priceElement.textContent =
                "₹" + price;


            // Add button
            const addButton =
                document.createElement("button");

            addButton.className = "add-btn";

            addButton.textContent =
                "Add to Cart";


            addButton.addEventListener(
                "click",
                function () {

                    addToCart(id);

                }
            );


            info.appendChild(title);
            info.appendChild(priceElement);
            info.appendChild(addButton);

            productCard.appendChild(imageElement);
            productCard.appendChild(info);

            list.appendChild(productCard);

        });

    }


    // =========================
    // SEARCH
    // =========================

    document
        .getElementById("search")
        .addEventListener(
            "input",
            displayProducts
        );


    // =========================
    // CATEGORY FILTER
    // =========================

    document
        .getElementById("category")
        .addEventListener(
            "change",
            displayProducts
        );


    // =========================
    // ADD TO CART
    // =========================

    function addToCart(id) {

        const existingProduct =
            cart.find(
                item =>
                    String(item.id) ===
                    String(id)
            );


        if (existingProduct) {

            existingProduct.quantity++;

        } else {

            const product =
                products.find(
                    item =>
                        String(item.id) ===
                        String(id)
                );


            if (!product) {

                alert(
                    "Product could not be found."
                );

                return;
            }


            cart.push({

                ...product,

                quantity: 1

            });

        }


        updateCart();

        alert(
            "Product added to cart!"
        );
    }


    // =========================
    // UPDATE CART
    // =========================

    function updateCart() {

        const cartItems =
            document.getElementById(
                "cart-items"
            );

        cartItems.innerHTML = "";

        let total = 0;
        let count = 0;


        if (cart.length === 0) {

            cartItems.innerHTML = `
                <p style="
                    text-align:center;
                    padding:20px;
                ">
                    Your cart is empty.
                </p>
            `;
        }


        cart.forEach(item => {

            const price =
                Number(item.price) || 0;

            total +=
                price * item.quantity;

            count +=
                item.quantity;


            cartItems.innerHTML += `
                <div class="cart-item">

                    <img
                        src="${escapeHtml(
                            item.image || ""
                        )}"
                        alt="${escapeHtml(
                            item.name || "Product"
                        )}"
                    >

                    <div class="cart-details">

                        <strong>
                            ${escapeHtml(
                                item.name || "Product"
                            )}
                        </strong>

                        <p>
                            ₹${price}
                        </p>

                        <div class="quantity">

                            <button
                                onclick='changeQuantity(
                                    ${JSON.stringify(item.id)},
                                    -1
                                )'
                            >
                                −
                            </button>

                            <span>
                                ${item.quantity}
                            </span>

                            <button
                                onclick='changeQuantity(
                                    ${JSON.stringify(item.id)},
                                    1
                                )'
                            >
                                +
                            </button>

                        </div>

                        <button
                            class="remove"
                            onclick='removeFromCart(
                                ${JSON.stringify(item.id)}
                            )'
                        >
                            Remove
                        </button>

                    </div>

                </div>
            `;
        });


        document.getElementById(
            "cart-total"
        ).textContent = total;


        document.getElementById(
            "cart-count"
        ).textContent = count;

    }


    // =========================
    // CHANGE QUANTITY
    // =========================

    function changeQuantity(
        id,
        change
    ) {

        const item =
            cart.find(
                product =>
                    String(product.id) ===
                    String(id)
            );


        if (!item) return;


        item.quantity += change;


        if (item.quantity <= 0) {

            removeFromCart(id);

            return;
        }


        updateCart();
    }


    // =========================
    // REMOVE FROM CART
    // =========================

    function removeFromCart(id) {

        cart =
            cart.filter(
                item =>
                    String(item.id) !==
                    String(id)
            );


        updateCart();
    }


    // =========================
    // OPEN CART
    // =========================

    function openCart() {

        document
            .getElementById("cart")
            .classList.add("active");
    }


    // =========================
    // CLOSE CART
    // =========================

    function closeCart() {

        document
            .getElementById("cart")
            .classList.remove("active");
    }


    // =========================
    // OPEN CHECKOUT
    // =========================

    function openCheckout() {

        if (cart.length === 0) {

            alert(
                "Your cart is empty."
            );

            return;
        }


        document
            .getElementById("checkout")
            .classList.add("active");
    }


    // =========================
    // CLOSE CHECKOUT
    // =========================

    function closeCheckout() {

        document
            .getElementById("checkout")
            .classList.remove("active");
    }


    // =========================
    // PLACE ORDER
    // =========================

    const checkoutForm =
        document.getElementById(
            "checkout-form"
        );


    checkoutForm.addEventListener(
        "submit",
        async function (e) {

            e.preventDefault();


            if (cart.length === 0) {

                alert(
                    "Your cart is empty."
                );

                return;
            }


            const order = {

                name:
                    document
                        .getElementById("name")
                        .value
                        .trim(),

                email:
                    document
                        .getElementById("email")
                        .value
                        .trim(),

                phone:
                    document
                        .getElementById("phone")
                        .value
                        .trim(),

                address:
                    document
                        .getElementById("address")
                        .value
                        .trim(),

                paymentMethod:
                    document
                        .getElementById("payment")
                        .value,

                items: cart,

                total:
                    cart.reduce(
                        (
                            sum,
                            item
                        ) =>
                            sum +
                            (
                                Number(
                                    item.price
                                ) || 0
                            ) *
                            item.quantity,
                        0
                    )
            };


            try {

                const response =
                    await fetch(
                        "/api/orders",
                        {
                            method: "POST",

                            headers: {
                                "Content-Type":
                                    "application/json"
                            },

                            body:
                                JSON.stringify(
                                    order
                                )
                        }
                    );


                const result =
                    await response.json();


                if (!response.ok) {

                    throw new Error(
                        result.error ||
                        "Order failed"
                    );
                }


                alert(
                    "Order placed successfully!" +
                    "\n\nOrder ID: " +
                    (
                        result.orderId ||
                        "Generated successfully"
                    )
                );


                cart = [];

                updateCart();

                checkoutForm.reset();

                closeCheckout();

                closeCart();


            } catch (error) {

                console.error(
                    "Order error:",
                    error
                );


                alert(
                    "Could not place order." +
                    "\n\n" +
                    error.message
                );
            }

        }
    );


    // =========================
    // SECURITY HELPER
    // =========================

    function escapeHtml(value) {

        return String(value)

            .replace(
                /&/g,
                "&amp;"
            )

            .replace(
                /</g,
                "&lt;"
            )

            .replace(
                />/g,
                "&gt;"
            )

            .replace(
                /"/g,
                "&quot;"
            )

            .replace(
                /'/g,
                "&#039;"
            );
    }


    // =========================
    // START WEBSITE
    // =========================

    updateCart();

    loadProducts();

</script>

</body>
</html>
